const D=n=>S.days[n]||{},done=n=>!!D(n).done;
const cnt=()=>Object.values(S.days).filter(d=>d.done).length;
function streak(){let d=cur();if(!done(d))d--;let c=0;while(d>0&&done(d)){c++;d--}return c}
function maxStreak(){let m=0,c=0;for(let i=1;i<=30;i++){c=done(i)?c+1:0;m=Math.max(m,c)}return m}
function pts(){let p=0;Object.values(S.days).forEach(d=>{if(d.done)p+=(d.learned?10:0)+(d.built?25:0)+(d.proof?15:0)+(d.next?5:0)});const m=maxStreak();[[3,10],[7,25],[14,50],[21,75]].forEach(a=>{if(m>=a[0])p+=a[1]});
return p+Object.keys(S.ms).length*50+(S.early?75:0)+(done(30)?150:0)+(S.show.result?100:0)}
function level(){const c=cnt();return done(30)?'SPRINT COMPLETED':c>=27?'MASTER IN PROGRESS':c>=18?'EXECUTOR':(c>=9||S.early)?'BUILDER':c>=3?'CONSISTENT':'SPRINTER'}
function ratio(){const l=Object.values(S.days).filter(d=>d.done&&d.learned).length,a=Object.values(S.days).filter(d=>d.done&&d.built&&d.proof).length;return l?Math.min(100,Math.round(a/l*100)):0}
function missed(){let c=0;for(let i=1;i<=30;i++)if(i<cal()&&!done(i))c++;return c}
function missedOld(){let m=0,d=cur()-1;while(d>0&&!done(d)){m++;d--}return m}
function mins(){const t=+S.p.mins;return[Math.round(t*.3),Math.round(t*.55),Math.max(5,Math.round(t*.15))]}
function coach(){const ds=Object.values(S.days).filter(d=>d.done),hard=ds.slice(-3).filter(d=>d.diff==='Too hard').length,r=ratio();

return'You have learned enough to apply it. Make something with what you learned before you watch or read more.'}

const sk=streak();h+=`<div class="stats"><div><b><span class="fl ${sk?'':'off'}" aria-hidden="true">🔥</span> ${sk}</b>day streak</div><div><b>${pts()}</b>points</div><div><b>${ratio()}%</b>action ratio</div></div>`;return h}
function checkin(n){const d=D(n);if(PPd!==n){PP=(PC['d'+n]||[]).slice();PPd=n}
return`<form id="ci" class="c" onsubmit="event.preventDefault();submitDay(${n})"><h2>Day ${n} check-in</h2><label>What did you learn?</label><textarea name="learned">${esc(d.learned)}</textarea><label>What did you build or apply with it?</label><textarea name="built">${esc(d.built)}</textarea><label>Proof</label><p class="sub">Add a link, some writing, photos or screenshots. Any mix works.</p><input name="plink" inputmode="url" autocapitalize="none" autocomplete="off" placeholder="Paste a link (optional)" value="${esc(d.plink)}"><textarea name="pnote" placeholder="Write about your proof: what it shows and what you did (optional)">${esc(d.pnote)}</textarea>${picBox(PP,'d')}<label>How difficult was today?</label><select name="diff"><option>Too easy</option><option selected>Just right</option><option>Too hard</option></select><label>Next step</label><input name="next" value="${esc(d.next)}"><button class="big">Complete day</button></form>`}
function submitDay(n){if(n!==cur()||(n==30&&cal()>30&&!done(30))){edit=null;render();return}const f=new FormData($('#ci')),g=k=>(f.get(k)||'').trim();
if(!g('built')){msg='What did you make with what you just learned? Nothing yet? Do a 10-minute application mission now: write, sketch or code one tiny piece, then describe it above.';render();window.scrollTo(0,0);return}
let pl=g('plink'),pn=g('pnote');if(/\s/.test(pl)){pn=(pl+'\n'+pn).trim();pl=''}if(pl&&!/^https?:\/\//i.test(pl))pl='https://'+pl;const np=PP.length,pr=[pl,pn].filter(Boolean).join(' · ')||(np?'Photo proof':'');
const v={learned:g('learned'),built:g('built'),proof:pr,plink:pl,pnote:pn,np,diff:g('diff'),next:g('next'),done:1,at:Date.now()};
load(['Saving your proof…','Updating your streak…','Adding your points…'],1800,()=>{const first=!done(n);S.days[n]=v;PC['d'+n]=PP.slice();savePC();pushPics('d'+n);PPd=null;
if(!S.early&&n<=21&&n>=11&&v.proof)S.early=true;edit=null;msg=first?'+'+(10+25+(v.proof?15:0)+(v.next?5:0))+' points. Streak: '+streak()+' days.':'Saved.';if(cnt()==3)msg+=' You’ve unlocked SPRINTER status.';save();render()})}
function review(){const w=Math.ceil(cur()/7);if(S.ms[w])return`<div class="c"><b>Week ${w} milestone complete. +50</b></div>`;return`<form id="wr" class="c" onsubmit="event.preventDefault();doWeek(${w})"><h2>Week ${w} review</h2><p class="mut">${['Foundation','Application','Build','Finish'][w-1]||'Finish'} week.</p><label>Look back: what did you learn?</label><input name="a"><label>Show: what did you build? (required)</label><input name="s"><label>Evaluate: what is working?</label><input name="e"><label>Identify: where are you stuck?</label><input name="i"><label>Plan: what must happen next week?</label><input name="p"><button class="big">Complete milestone</button></form>`}
function doWeek(w){const f=new FormData($('#wr'));if(!(f.get('s')||'').trim()){alert('Show one artifact to unlock the next week.');return}load(['Saving your review…','Unlocking next week…'],1500,()=>{S.ms[w]=1;msg='Week '+w+' milestone complete. +50 points.';save();render()})}
function sprint(){const n=cur(),lab=[[1,'Intention'],[5,'Artifact'],[10,'Prototype'],[15,'Core functionality'],[21,'Working version'],[27,'Refinement'],[30,'Final product']];
const m=Object.entries(S.days).filter(e=>e[1].done).slice(-5).reverse();
return`<div class="crumb">Sprint / My sprint</div><h1>My sprint</h1><div class="c"><h3>Sprint map</h3><div class="map">${lab.map(a=>`<div class="${done(a[0])?'d':n>a[0]?'x':n==a[0]?'cu':''}"><b>Day ${a[0]}</b> ${a[1]}${!done(a[0])&&n>a[0]?' <span class="mut">· missed</span>':''}${D(a[0]).built?`<div class="mut">${esc(D(a[0]).built.slice(0,90))}</div>`:''}</div>`).join('')}</div></div>
<div class="c"><h3>Progress</h3><p>${cnt()} of 30 days complete · ${level()}</p><div class="bar"><i style="width:${cnt()/30*100}%"></i></div><p class="mut" style="margin-top:10px">Next milestone: ${n<=7?'Week 1 review':n<=14?'Week 2 review':n<=21?'Week 3 review':'Week 4 review and showcase'}</p></div>
<div class="c"><h3>Recent work</h3>${m.length?m.map(e=>{const k=e[0],d=e[1],ps=PC['d'+k]||[],note=d.pnote!==undefined||d.plink!==undefined?d.pnote:d.proof;return`<div style="margin-bottom:14px"><p style="margin:0 0 4px"><b>Day ${k}:</b> ${esc(d.built)}</p>${okUrl(d.plink)?`<p class="mut" style="margin:0 0 4px">Link: <a class="pl" href="${esc(d.plink)}" target="_blank" rel="noopener">${esc(d.plink)}</a></p>`:''}${note?`<p class="mut" style="margin:0 0 4px">${esc(note)}</p>`:''}${ps.length?`<div class="thumbs">${ps.map(x=>`<img src="${x}" alt="Proof photo" onclick="zoom(this.src)">`).join('')}</div>`:d.np?`<p class="mut" style="margin:0">${d.np} photo${d.np>1?'s':''} attached</p>`:''}</div>`}).join(''):'<p class="mut">Complete a day to see your work here.</p>'}</div>`}
function rank(){watchBoard();return`<div class="crumb">Sprint / Pod</div><h1>Pod and leaderboard</h1><div id="pb">${podboard()}</div>`}
function setLb(x){lb=x;$('#pb').innerHTML=podboard()}
function podboard(){const me={id:myId||'me',n:S.p.name,o:pts(),c:cnt()*10,b:builds(),day:cur(),lvl:level()},oth=live.filter(x=>x.id!==me.id),rows=oth.concat(me),k={Overall:'o',Consistency:'c',Building:'b'}[lb]||'o',t0=new Date().setHours(0,0,0,0);
rows.sort((a,b)=>(b[k]||0)-(a[k]||0));const pod=oth.slice().sort((a,b)=>a.id<b.id?-1:1).slice(0,4);
const podH=pod.length?pod.map(m=>`<div class="pm"><span class="av">${esc((m.n||'?')[0].toUpperCase())}</span><span class="pn">${esc(m.n)}</span><span class="st ${(m.ld||0)>=t0?'y':''}">${(m.ld||0)>=t0?'Checked in today':'Not yet'}</span></div>`).join(''):`<p class="mut">${BR.ok?'Your pod fills up as more people join the sprint.':'Finding your pod…'}</p>`;
return`<div class="c"><h3>Your accountability pod</h3>${podH}<p class="mut" style="margin-top:10px">Pod members see check-in status, never your reflections.</p><div class="amy"><span><b>Ask</b>one specific question</span><span><b>Help</b>one person</span><span><b>Move</b>back to your mission</span></div></div>
<div class="seg">${['Overall','Consistency','Building'].map(x=>`<button class="${lb==x?'on':''}" onclick="setLb('${x}')">${x}</button>`).join('')}</div>
<div class="c" style="padding:10px 12px">${rows.map((r,i)=>`<div class="lbr ${r.id==me.id?'me2':''}"><span class="rk r${i+1}">${i+1}</span><div class="lbn"><b>${esc(r.n)}${r.id==me.id?' (you)':''}</b><small>Day ${r.day||1} · ${esc(r.lvl||'SPRINTER')}</small></div><span class="lbp">${r[k]||0}<small> pts</small></span></div>`).join('')}</div>
<p class="mut">${BR.err?'Could not load the live leaderboard. Showing your score only.':BR.ok?rows.length+(rows.length==1?' participant':' participants')+' · live. ':'Loading…'} Rank is motivation only; winners are chosen by judges on evidence.</p>`}
function est(){const dd=Object.values(S.days).filter(d=>d.done),c=dd.length,f=x=>dd.filter(x).length;return[['Consistency & Accountability',20,Math.round(c/30*20)],['Learning Progress',15,Math.round(f(d=>d.learned)/30*15)],['Practical Application',20,Math.round(f(d=>d.built&&d.proof)/30*20)],['Tangible Build / Final Outcome',25,S.show.result?((S.show.proof||S.show.slink||S.show.np)?25:15):0],['Problem-Solving & Improvement',10,Math.min(10,Math.round(f(d=>d.next)/30*10)+(S.early?2:0))],['Documentation & Reflection',5,Math.min(5,Math.round(f(d=>d.next&&d.learned)/30*5)+(S.show.journey?1:0))],['Community Contribution',5,Math.min(5,S.helps)]]}
function saveShow(){const f=new FormData($('#sf'));load(['Building your showcase…','Saving…'],1500,()=>{F.forEach(a=>S.show[a[0]]=(f.get(a[0])||'').trim());let l=(f.get('slink')||'').trim();if(/\s/.test(l)){S.show.proof=(l+'\n'+(S.show.proof||'')).trim();l=''}if(l&&!/^https?:\/\//i.test(l))l='https://'+l;S.show.slink=l;S.show.np=PS.length;PC.show=PS.slice();savePC();pushPics('show');msg='Showcase saved. +100 points.';save();render()})}
function show(){const s=S.show,p=S.p;if(cur()<28&&!s.result)return`<div class="crumb">Sprint / Showcase</div><h1>Showcase</h1><div class="c"><p>Your showcase opens in the final 72 hours. Day 28: finish the core build. Day 29: document the transformation. Day 30: show what you built.</p><p class="mut">Keep building. It is Day ${cur()}.</p></div>`;
if(!PS0){PS=(PC.show||[]).slice();PS0=1}
const view=s.result?`<div class="c pop hero" id="sc"><h2>${esc(p.name)}: ${esc(p.skill)}</h2><p><b>Goal:</b> ${esc(p.goal)}</p><p><b>Before:</b> ${esc(s.before)}</p><p><b>Result:</b> ${esc(s.result)}</p><p><b>Proof:</b> ${esc(s.proof)}</p>${okUrl(s.slink)?`<p><b>Link:</b> <a class="pl" href="${esc(s.slink)}" target="_blank" rel="noopener">${esc(s.slink)}</a></p>`:''}${(PC.show||[]).length?`<div class="thumbs">${PC.show.map(x=>`<img src="${x}" alt="Proof photo" onclick="zoom(this.src)">`).join('')}</div>`:''}<p><b>Lesson:</b> ${esc(s.lesson)}</p><p>${cnt()} days completed · ${maxStreak()}-day best streak · Next: ${esc(s.nextstep)}</p><button onclick="navigator.clipboard&&navigator.clipboard.writeText(document.querySelector('#sc').innerText);msg='Showcase copied.';render()">Copy showcase</button></div>`:'';
return`<div class="crumb">Sprint / Showcase</div><h1>Final showcase</h1>${msg?`<div class="c"><b>${msg}</b></div>`:''}${view}<form id="sf" class="c" onsubmit="event.preventDefault();saveShow()"><h3>Build your showcase</h3>${F.map(a=>`<label>${a[1]}</label><textarea name="${a[0]}">${esc(s[a[0]])}</textarea>`+(a[0]=='proof'?`<label>Link to your work (optional)</label><input name="slink" inputmode="url" autocapitalize="none" autocomplete="off" placeholder="https://" value="${esc(s.slink)}"><label>Photos or screenshots</label>${picBox(PS,'s')}`:'')).join('')}<button class="big">Save showcase</button></form>`}
function rules(){const e=est(),t=e.reduce((a,b)=>a+b[2],0),P=(rows,cls)=>rows.map(r=>`<div class="pi"><div><b>${r[0]}</b><small>${r[1]}</small></div><span class="pt ${cls||''}">+${r[2]}</span></div>`).join('');
return`<div class="crumb">Sprint / Rules</div><h1>Judging and points</h1>
<div class="c"><h3>Daily points</h3><p class="sub">Earned each day you complete a check-in. Up to 55 a day.</p>${P([['Learn','Write what you learned today.',10],['Build','Describe what you made or applied.',25],['Proof','Add a link, screenshot or note.',15],['Reflect','Set your next step.',5]])}</div>
<div class="c"><h3>Streak bonuses</h3><p class="sub">One-time bonus when your best streak reaches each mark.</p>${P([['3-day streak','',10],['7-day streak','',25],['14-day streak','',50],['21-day streak','',75]],'o')}</div>
<div class="c"><h3>Milestones</h3>${P([['Weekly review','Complete the review at the end of each week.',50],['Early build','Add proof between Days 11 and 21.',75],['Complete Day 30','Finish the full sprint.',150],['Final showcase','Submit your showcase.',100]])}<p class="mut" style="margin:10px 0 0">Building earns more than consuming: build and proof are worth 40 of the 55 daily points.</p></div>
<div class="c"><h3>Judging criteria</h3><p class="sub">Out of 100. Judges review your evidence, not your rank.</p>${e.map(r=>`<div class="jr"><div class="row sp"><b>${r[0]}</b><span><b>${r[2]}</b> / ${r[1]}</span></div><div class="bar"><i style="width:${r[1]?r[2]/r[1]*100:0}%"></i></div></div>`).join('')}<div class="tot"><span>Your evidence score</span><span>${t} / 100</span></div><p class="mut" style="margin:10px 0 0">Shortlists come from evidence scores, then judges review the submitted work. Top 3 receive an Award of Recognition; everyone who finishes gets completion recognition.</p></div>`}
function render(){if(edit==null)PPd=null;const a=$('#app'),d=$('#dt');d.hidden=!S||card;const ub=$('#ub');ub.hidden=!S||card;if(S&&!card)ub.innerHTML=S.p.pic?`<img src="${S.p.pic}" alt="">`:esc((S.p.name||'?')[0].toUpperCase());if(S)d.textContent='Day '+cur()+' of 30';
if(!S){a.innerHTML=onboard();$('#nav').hidden=true;return}
a.innerHTML=(card||showCard)?cardView():{today,sprint,rank,show,rules}[tab]();nav();window.scrollTo(0,0)}
let LC=null;setInterval(()=>{if(!S||card||edit!=null){return}const c=cur();if(LC!==null&&c!==LC&&tab=='today'&&!showCard)render();LC=c},60000);
if(ready){busy('Loading…');const un=auth.onAuthStateChanged(u=>{un();boot(u)})}else render()
</script></body></html>
