function maxStreak(){let m=0,c=0;for(let i=1;i<=30;i++){c=done(i)?c+1:0;m=Math.max(m,c)}return m}

function wrapL(x,t,px,y,w,lh,max){const ws=String(t||'—').split(/\s+/);let L=[],l='';ws.forEach(wd=>{const tt=l?l+' '+wd:wd;if(x.measureText(tt).width>w&&l){L.push(l);l=wd}else l=tt});L.push(l);if(L.length>max){L=L.slice(0,max);let q=L[max-1];while(q&&x.measureText(q+'…').width>w)q=q.slice(0,-1);L[max-1]=q+'…'}L.forEach((q,i)=>x.fillText(q,px,y+i*lh));return y+L.length*lh}
